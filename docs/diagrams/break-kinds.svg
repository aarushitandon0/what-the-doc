<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 512" width="1000" height="512" role="img" aria-label="Four things in a DOCX that look like a page break, and which repair applies to each.">
  <style>
    .bg   { fill: #FFF7E9; stroke: #E8DCC6; }
    .card { fill: #FFFFFF; stroke: #143B2F; stroke-width: 1.4; }
    .t    { font-family: Rubik, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #13221D; }
    .title{ font-size: 21px; font-weight: 600; }
    .sub  { font-size: 13px; fill: #4F5F57; }
    .head { font-size: 13.5px; font-weight: 600; fill: #143B2F; }
    .headb{ font-size: 13.5px; font-weight: 600; fill: #8C3322; }
    .d    { font-size: 12px; fill: #30423A; }
    .cap  { font-size: 10px; fill: #7A8A82; letter-spacing: .8px; }
    .snip { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 10.5px; fill: #13221D; }
    .pillt{ font-size: 11.5px; font-weight: 600; fill: #143B2F; }
    .pilltb{ font-size: 11.5px; font-weight: 600; fill: #8C3322; }
    .rule { stroke: #E0D5BE; stroke-width: 1; }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="999" height="511" rx="14"/>
  <text class="t title" x="40" y="46">Four things that look like a page break</text>
  <text class="t sub" x="40" y="70">They are not interchangeable, and neither are their repairs. Confusing them is how a confident fix breaks a document.</text>
  <rect class="card" x="44" y="116" width="216" height="320" rx="9"/>
  <path d="M45 150 V126 a9 9 0 0 1 9 -9 H250 a9 9 0 0 1 9 9 V150 z" fill="#DDE9CF"/>
  <line class="rule" x1="45" y1="150" x2="259" y2="150"/>
  <text class="t head" x="60" y="139">Paragraph property</text>
  <rect x="58" y="162" width="188" height="26" rx="6" fill="#F6F1E4" stroke="#D9CDB6" stroke-width="1"/>
  <text class="snip" x="68" y="179">w:pageBreakBefore</text>
  <text class="t cap" x="60" y="212">WHAT IT IS</text>
  <text class="t d" x="60" y="232">A property on the paragraph</text>
  <text class="t d" x="60" y="249">itself, one of six writable</text>
  <text class="t d" x="60" y="266">fields.</text>
  <line class="rule" x1="58" y1="286" x2="246" y2="286"/>
  <text class="t cap" x="60" y="308">REPAIR</text>
  <text class="t d" x="60" y="328">Write it or clear it, with up</text>
  <text class="t d" x="60" y="345">to 12 changes in one plan.</text>
  <rect x="58" y="396" width="188" height="26" rx="13" fill="#DDE9CF" stroke="#143B2F" stroke-width="1.2"/>
  <text class="t pillt" x="152" y="413" text-anchor="middle">repairable</text>
  <rect class="card" x="276" y="116" width="216" height="320" rx="9"/>
  <path d="M277 150 V126 a9 9 0 0 1 9 -9 H482 a9 9 0 0 1 9 9 V150 z" fill="#DDE9CF"/>
  <line class="rule" x1="277" y1="150" x2="491" y2="150"/>
  <text class="t head" x="292" y="139">Explicit break element</text>
  <rect x="290" y="162" width="188" height="26" rx="6" fill="#F6F1E4" stroke="#D9CDB6" stroke-width="1"/>
  <text class="snip" x="300" y="179">w:br w:type=&quot;page&quot;</text>
  <text class="t cap" x="292" y="212">WHAT IT IS</text>
  <text class="t d" x="292" y="232">A break someone typed into a</text>
  <text class="t d" x="292" y="249">run. Also w:type=&quot;column&quot;.</text>
  <line class="rule" x1="290" y1="286" x2="478" y2="286"/>
  <text class="t cap" x="292" y="308">REPAIR</text>
  <text class="t d" x="292" y="328">Delete exactly one, named by</text>
  <text class="t d" x="292" y="345">a server-issued target id and</text>
  <text class="t d" x="292" y="362">never by XML, XPath or index.</text>
  <rect x="290" y="396" width="188" height="26" rx="13" fill="#DDE9CF" stroke="#143B2F" stroke-width="1.2"/>
  <text class="t pillt" x="384" y="413" text-anchor="middle">one per diagnosis</text>
  <rect class="card" x="508" y="116" width="216" height="320" rx="9"/>
  <path d="M509 150 V126 a9 9 0 0 1 9 -9 H714 a9 9 0 0 1 9 9 V150 z" fill="#DDE9CF"/>
  <line class="rule" x1="509" y1="150" x2="723" y2="150"/>
  <text class="t head" x="524" y="139">Section start</text>
  <rect x="522" y="162" width="188" height="26" rx="6" fill="#F6F1E4" stroke="#D9CDB6" stroke-width="1"/>
  <text class="snip" x="532" y="179">w:sectPr w:type=&quot;nextPage&quot;</text>
  <text class="t cap" x="524" y="212">WHAT IT IS</text>
  <text class="t d" x="524" y="232">Where the next section begins</text>
  <text class="t d" x="524" y="249">on the page.</text>
  <line class="rule" x1="522" y1="286" x2="710" y2="286"/>
  <text class="t cap" x="524" y="308">REPAIR</text>
  <text class="t d" x="524" y="328">nextPage becomes continuous,</text>
  <text class="t d" x="524" y="345">on its own, never combined.</text>
  <text class="t d" x="524" y="362">The first section is never</text>
  <text class="t d" x="524" y="379">eligible.</text>
  <rect x="522" y="396" width="188" height="26" rx="13" fill="#DDE9CF" stroke="#143B2F" stroke-width="1.2"/>
  <text class="t pillt" x="616" y="413" text-anchor="middle">alone, or not at all</text>
  <rect class="card" x="740" y="116" width="216" height="320" rx="9"/>
  <path d="M741 150 V126 a9 9 0 0 1 9 -9 H946 a9 9 0 0 1 9 9 V150 z" fill="#FBE9E4"/>
  <line class="rule" x1="741" y1="150" x2="955" y2="150"/>
  <text class="t headb" x="756" y="139">Rendered break</text>
  <rect x="754" y="162" width="188" height="26" rx="6" fill="#F6F1E4" stroke="#D9CDB6" stroke-width="1"/>
  <text class="snip" x="764" y="179">w:lastRenderedPageBreak</text>
  <text class="t cap" x="756" y="212">WHAT IT IS</text>
  <text class="t d" x="756" y="232">Written by whichever program</text>
  <text class="t d" x="756" y="249">last paginated the file.</text>
  <line class="rule" x1="754" y1="286" x2="942" y2="286"/>
  <text class="t cap" x="756" y="308">REPAIR</text>
  <text class="t d" x="756" y="328">None. Nobody typed it, and</text>
  <text class="t d" x="756" y="345">clearing it would mean editing</text>
  <text class="t d" x="756" y="362">a cached layout result.</text>
  <rect x="754" y="396" width="188" height="26" rx="13" fill="#FBE9E4" stroke="#B8422D" stroke-width="1.2"/>
  <text class="t pilltb" x="848" y="413" text-anchor="middle">never removable</text>
  <text class="t d" x="44" y="466">Making a section continuous does not promise that a visible page break disappears. Page geometry and other settings can still force pagination,</text>
  <text class="t d" x="44" y="486">so the service reports the real before and after page counts rather than claiming a reduction.</text>
</svg>
