<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 952" width="1000" height="952" role="img" aria-label="The repair flow from upload through diagnosis, validation, rendering and human review to download.">
  <style>
    .bg   { fill: #FFF7E9; stroke: #E8DCC6; }
    .box  { fill: #FFFFFF; stroke: #143B2F; stroke-width: 1.4; }
    .hi   { fill: #DDE9CF; stroke: #143B2F; stroke-width: 1.8; }
    .t    { font-family: Rubik, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #13221D; }
    .title{ font-size: 21px; font-weight: 600; }
    .sub  { font-size: 13px; fill: #4F5F57; }
    .h    { font-size: 15px; font-weight: 600; }
    .d    { font-size: 12px; fill: #5A6A62; }
    .step { font-size: 12px; font-weight: 600; fill: #FF8739; }
    .stop { fill: #FBE9E4; stroke: #B8422D; stroke-width: 1.1; }
    .stopt{ font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 11.5px; fill: #8C3322; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #30423A; }
    .arr  { stroke: #143B2F; stroke-width: 1.6; fill: none; }
    .tie  { stroke: #B8422D; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#143B2F"/>
    </marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="999" height="951" rx="14"/>

  <text class="t title" x="40" y="46">The repair flow</text>
  <text class="t sub" x="40" y="70">One complaint, one paragraph, one candidate file. Each gate on the right can end the run, and ending it is a normal outcome.</text>

  <!-- spine arrows -->
  <path class="arr" d="M300 162 V182" marker-end="url(#a)"/>
  <path class="arr" d="M300 244 V264" marker-end="url(#a)"/>
  <path class="arr" d="M300 326 V346" marker-end="url(#a)"/>
  <path class="arr" d="M300 408 V428" marker-end="url(#a)"/>
  <path class="arr" d="M300 490 V510" marker-end="url(#a)"/>
  <path class="arr" d="M300 572 V592" marker-end="url(#a)"/>
  <path class="arr" d="M300 654 V674" marker-end="url(#a)"/>
  <path class="arr" d="M300 736 V756" marker-end="url(#a)"/>

  <!-- 1 -->
  <rect class="box" x="60" y="104" width="480" height="58" rx="9"/>
  <text class="t step" x="78" y="126">01</text>
  <text class="t h" x="108" y="127">Upload the document</text>
  <text class="t d" x="108" y="147">POST /api/documents. The file keeps no name you gave it.</text>
  <path class="tie" d="M540 133 H594"/>
  <rect class="stop" x="594" y="119" width="340" height="28" rx="7"/>
  <text class="stopt" x="608" y="137">oversize, tracked changes, VBA, duplicate entries</text>

  <!-- 2 -->
  <rect class="box" x="60" y="186" width="480" height="58" rx="9"/>
  <text class="t step" x="78" y="208">02</text>
  <text class="t h" x="108" y="209">Read the evidence</text>
  <text class="t d" x="108" y="229">Effective properties, same-style peers, breaks, sections.</text>
  <text class="t d" x="594" y="220">Read only. Nothing has been written yet.</text>

  <!-- 3 -->
  <rect class="box" x="60" y="268" width="480" height="58" rx="9"/>
  <text class="t step" x="78" y="290">03</text>
  <text class="t h" x="108" y="291">Say what looks wrong</text>
  <text class="t d" x="108" y="311">POST /api/jobs with one paragraph id and one complaint.</text>
  <text class="t d" x="594" y="302">Plain language. No field names required.</text>

  <!-- 4 -->
  <rect class="box" x="60" y="350" width="480" height="58" rx="9"/>
  <text class="t step" x="78" y="372">04</text>
  <text class="t h" x="108" y="373">Local Gemma answers</text>
  <text class="t d" x="108" y="393">Sees resolved values in points. Never a path, XML, tool or shell.</text>
  <path class="tie" d="M540 379 H594"/>
  <rect class="stop" x="594" y="365" width="290" height="28" rx="7"/>
  <text class="stopt" x="608" y="383">model_unavailable, model_timeout</text>

  <!-- 5 -->
  <rect class="box" x="60" y="432" width="480" height="58" rx="9"/>
  <text class="t step" x="78" y="454">05</text>
  <text class="t h" x="108" y="455">Schema check</text>
  <text class="t d" x="108" y="475">diagnosis.py decides what an answer is not allowed to be.</text>
  <path class="tie" d="M540 461 H594"/>
  <rect class="stop" x="594" y="447" width="160" height="28" rx="7"/>
  <text class="stopt" x="608" y="465">invalid_response</text>

  <!-- 6 -->
  <rect class="box" x="60" y="514" width="480" height="58" rx="9"/>
  <text class="t step" x="78" y="536">06</text>
  <text class="t h" x="108" y="537">Plan check</text>
  <text class="t d" x="108" y="557">engine.validate re-checks every bound before a byte is written.</text>
  <path class="tie" d="M540 543 H594"/>
  <rect class="stop" x="594" y="529" width="330" height="28" rx="7"/>
  <text class="stopt" x="608" y="547">invalid_operation, unsupported_formatting</text>

  <!-- 7 -->
  <rect class="box" x="60" y="596" width="480" height="58" rx="9"/>
  <text class="t step" x="78" y="618">07</text>
  <text class="t h" x="108" y="619">Patch a copy, render both sides</text>
  <text class="t d" x="108" y="639">The source file is opened for reading and never written to.</text>
  <path class="tie" d="M540 625 H594"/>
  <rect class="stop" x="594" y="611" width="150" height="28" rx="7"/>
  <text class="stopt" x="608" y="629">render_failure</text>

  <!-- 8 -->
  <rect class="box" x="60" y="678" width="480" height="58" rx="9"/>
  <text class="t step" x="78" y="700">08</text>
  <text class="t h" x="108" y="701">Verify against the files on disk</text>
  <text class="t d" x="108" y="721">Text, runs, styles.xml, ZIP members, original hash.</text>
  <path class="tie" d="M540 707 H594"/>
  <rect class="stop" x="594" y="693" width="300" height="28" rx="7"/>
  <text class="stopt" x="608" y="711">any failed invariant ends the job</text>

  <!-- 9 -->
  <rect class="hi" x="60" y="756" width="480" height="58" rx="9"/>
  <text class="t step" x="78" y="778">09</text>
  <text class="t h" x="108" y="779">awaiting_review</text>
  <text class="t d" x="108" y="799">A candidate exists. Nothing has been accepted.</text>
  <text class="t d" x="594" y="790">The best automatic outcome there is.</text>

  <path class="arr" d="M180 814 V846" marker-end="url(#a)"/>
  <path class="arr" d="M420 814 V846" marker-end="url(#a)"/>

  <rect class="box" x="60" y="856" width="230" height="64" rx="9"/>
  <text class="t h" x="78" y="882">A person accepts</text>
  <text class="t d" x="78" y="902">Invariants run again, then download.</text>

  <rect class="box" x="310" y="856" width="230" height="64" rx="9"/>
  <text class="t h" x="328" y="882">A person rejects</text>
  <text class="t d" x="328" y="902">The untouched original is the undo.</text>

  <text class="t d" x="594" y="886">Acceptance is a separate HTTP call carrying the</text>
  <text class="t d" x="594" y="904">candidate hash the reviewer actually saw.</text>
</svg>
