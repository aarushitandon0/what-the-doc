# Render Blueprint for the FULL APPLICATION: Ollama with gemma4:e2b, LibreOffice, the
# Python API and the React interface, in one Docker container. See DEPLOYMENT.md.
#
# Plan: 4c-8g (4 CPU, 8 GB, formerly "Pro Plus"). The model alone needs ~5-6 GB of
# memory, so anything with less than 8 GB will be killed when the model loads. This is
# a paid plan billed while the service exists: suspend or delete it after judging.
#
# The container runs the API in public mode (WTD_PUBLIC=1, set in the Dockerfile):
# per-browser job history, per-address rate limits, a queue cap, one-hour retention
# and no fixture injection. There are no accounts.
#
# No secrets here. SENTRY_DSN, if wanted, is added in the dashboard, never in this file.

services:
  - type: web
    runtime: docker
    name: what-the-doc
    plan: 4c-8g
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: false
    pullRequestPreviewsEnabled: false
    envVars:
      - key: GEMMA_MODEL
        value: gemma4:e2b
